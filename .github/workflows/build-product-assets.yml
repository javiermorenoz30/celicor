name: Build CELICOR product assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/products-sprite128/**'
      - '.github/workflows/build-product-assets.yml'

permissions:
  contents: write

concurrency:
  group: celicor-product-assets
  cancel-in-progress: true

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rebuild product sprite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets

          mapfile -t PARTS < <(find assets/products-sprite128 -maxdepth 1 -type f -name 'part-??.txt' | sort)
          if [ "${#PARTS[@]}" -ne 14 ]; then
            echo "Expected 14 sprite chunks, found ${#PARTS[@]}"
            printf '%s\n' "${PARTS[@]}"
            exit 1
          fi

          cat "${PARTS[@]}" | tr -d '\r\n ' | base64 --decode > assets/products-sprite.webp

          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/products-sprite.webp')
          d = p.read_bytes()
          if len(d) < 1000:
              raise SystemExit(f'Product sprite too small: {len(d)} bytes')
          if d[:4] != b'RIFF' or d[8:12] != b'WEBP':
              raise SystemExit('Invalid product WebP header')
          print(f'Valid product sprite: {len(d):,} bytes')
          PY

      - name: Commit generated product sprite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/products-sprite.webp

          if git diff --cached --quiet; then
            echo 'Product sprite already up to date.'
            exit 0
          fi

          git commit -m 'Build CELICOR product sprite [skip ci]'
          git push origin HEAD:main
