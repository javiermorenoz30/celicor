name: Build CELICOR product assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/products-sprite128/**'
      - '.github/workflows/build-product-assets.yml'

permissions:
  contents: read

concurrency:
  group: celicor-product-assets
  cancel-in-progress: true

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rebuild and validate product sprite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/celicor-assets

          python3 - <<'PY'
          from pathlib import Path
          import base64
          import binascii
          import re

          parts = sorted(Path('assets/products-sprite128').glob('part-??.txt'))
          if len(parts) != 14:
              raise SystemExit(f'Expected 14 sprite chunks, found {len(parts)}')

          chunks = [re.sub(r'\s+', '', p.read_text(encoding='utf-8')) for p in parts]
          if not all(chunks):
              raise SystemExit('One or more sprite chunks are empty')

          # Some historical CELICOR chunks were individually Base64-encoded,
          # while others were plain splits of one Base64 stream. Support both.
          individually_encoded = any('=' in chunk for chunk in chunks[:-1])

          try:
              if individually_encoded:
                  decoded = []
                  for index, chunk in enumerate(chunks):
                      try:
                          decoded.append(base64.b64decode(chunk, validate=True))
                      except binascii.Error as exc:
                          raise SystemExit(f'Invalid Base64 in chunk {index:02d}: {exc}')
                  raw = b''.join(decoded)
                  mode = 'individual Base64 chunks'
              else:
                  raw = base64.b64decode(''.join(chunks), validate=True)
                  mode = 'single Base64 stream'
          except binascii.Error as exc:
              raise SystemExit(f'Unable to decode sprite chunks: {exc}')

          riff = raw.find(b'RIFF')
          if riff < 0 or raw[riff + 8:riff + 12] != b'WEBP':
              raise SystemExit('No valid RIFF/WEBP image found after decoding chunks')

          if len(raw) < riff + 12:
              raise SystemExit('Decoded sprite header is incomplete')

          file_size = int.from_bytes(raw[riff + 4:riff + 8], 'little') + 8
          end = riff + file_size
          if file_size < 1000 or end > len(raw):
              raise SystemExit(f'Incomplete WebP payload: need {file_size} bytes, have {len(raw) - riff}')

          data = raw[riff:end]
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Extracted product asset is not WebP')

          width = height = None
          if data[12:16] == b'VP8X' and len(data) >= 30:
              width = 1 + int.from_bytes(data[24:27], 'little')
              height = 1 + int.from_bytes(data[27:30], 'little')

          output = Path('/tmp/celicor-assets/products-sprite.webp')
          output.write_bytes(data)
          print(f'CELICOR sprite OK · mode: {mode} · {file_size:,} bytes · dimensions: {width}x{height}')
          PY

      - name: Verify generated file
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/celicor-assets/products-sprite.webp
          file /tmp/celicor-assets/products-sprite.webp
          echo 'CELICOR product asset validation completed successfully.'
