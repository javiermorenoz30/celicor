name: Build CELICOR product assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/products-sprite128/**'
      - '.github/workflows/build-product-assets.yml'

permissions:
  contents: read

concurrency:
  group: celicor-product-assets
  cancel-in-progress: true

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate CELICOR product asset chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          parts = sorted(Path('assets/products-sprite128').glob('part-??.txt'))
          if len(parts) != 14:
              raise SystemExit(f'Expected 14 sprite chunks, found {len(parts)}')

          allowed = re.compile(r'^[A-Za-z0-9+/=\r\n\t ]+$')
          total = 0
          for index, part in enumerate(parts):
              text = part.read_text(encoding='utf-8')
              if not text.strip():
                  raise SystemExit(f'Chunk {index:02d} is empty')
              if not allowed.fullmatch(text):
                  raise SystemExit(f'Chunk {index:02d} contains non-Base64 characters')
              total += len(re.sub(r'\s+', '', text))

          if total < 10000:
              raise SystemExit(f'Product asset data is unexpectedly small: {total} Base64 characters')

          print(f'CELICOR product chunks OK · 14 files · {total:,} Base64 characters')
          print('Binary WebP reconstruction is handled safely by the storefront loader.')
          PY

      - name: Complete validation
        run: echo 'CELICOR product asset validation completed successfully.'
