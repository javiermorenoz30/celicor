name: Build CELICOR product assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/products-sprite128/**'
      - '.github/workflows/build-product-assets.yml'

permissions:
  contents: read

concurrency:
  group: celicor-product-assets
  cancel-in-progress: true

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rebuild and validate product sprite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/celicor-assets

          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          parts = sorted(Path('assets/products-sprite128').glob('part-??.txt'))
          if len(parts) != 14:
              raise SystemExit(f'Expected 14 sprite chunks, found {len(parts)}')

          encoded = ''.join(p.read_text(encoding='utf-8') for p in parts)
          encoded = re.sub(r'\s+', '', encoded)

          header = base64.b64decode(encoded[:40])
          if header[:4] != b'RIFF' or header[8:12] != b'WEBP':
              raise SystemExit('Invalid WebP RIFF header in sprite chunks')

          file_size = int.from_bytes(header[4:8], 'little') + 8
          needed_b64 = ((file_size + 2) // 3) * 4
          if len(encoded) < needed_b64:
              raise SystemExit(f'Incomplete sprite: need {needed_b64} Base64 chars, found {len(encoded)}')

          # Only decode the Base64 belonging to the first RIFF WebP. Older
          # chunk files contain legacy trailing data after that image.
          data = base64.b64decode(encoded[:needed_b64], validate=True)[:file_size]
          if len(data) != file_size or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Decoded sprite is invalid')

          if data[12:16] != b'VP8X' or len(data) < 30:
              raise SystemExit('Expected a VP8X WebP sprite')
          width = 1 + int.from_bytes(data[24:27], 'little')
          height = 1 + int.from_bytes(data[27:30], 'little')
          if (width, height) != (1280, 1408):
              raise SystemExit(f'Unexpected sprite dimensions: {width}x{height}; expected 1280x1408')

          output = Path('/tmp/celicor-assets/products-sprite.webp')
          output.write_bytes(data)
          print(f'CELICOR sprite OK: {file_size:,} bytes · {width}x{height} · 10 columns x 11 rows')
          PY

      - name: Verify generated file
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/celicor-assets/products-sprite.webp
          file /tmp/celicor-assets/products-sprite.webp
          echo 'CELICOR product asset validation completed successfully.'
